# A generic, single database configuration.

[alembic]
script_location = app/db/migrations
# Migration files live under alembic/versions (script_location only holds
# env.py + the template). Without this line `alembic upgrade head` silently
# applies NOTHING — do not remove.
version_locations = alembic/versions
prepend_sys_path = .
# Placeholder only — env.py overrides this from Settings at runtime.
sqlalchemy.url = postgresql+asyncpg://override-me@localhost:5432/aditi_assist

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
