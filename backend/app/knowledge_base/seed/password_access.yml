category: "access/permissions"
description: "Troubleshooting playbooks for password resets, account lockouts, and MFA issues"

articles:
  - id: "access-account-locked"
    title: "AD Account Locked / Unable to Login"
    category: "access/permissions"
    subcategory: "account-locked"
    tags: ["account locked", "login", "password", "AD", "active directory", "locked out"]
    keywords:
      ["account locked", "locked out", "can't login", "unable to login",
       "account is locked", "login failed", "too many attempts"]
    content: |
      Your Active Directory account gets locked after a set number of failed
      login attempts (usually 5). This blocks access to all Aditi systems
      including email, laptop login, VPN, and O365. The account must be unlocked
      by IT or auto-unlocks after 30 minutes of no attempts.
    short_summary: |
      Account locked after too many failed password attempts. Wait 30 min for
      auto-unlock, or use SSPR to reset your password immediately.
    resolution_steps:
      - step_number: 1
        instruction: "Stop all login attempts immediately"
        details: >
          Each failed attempt resets the lockout timer. Do not try again
          until you follow the steps below.
      - step_number: 2
        instruction: "Use Self-Service Password Reset (SSPR) to unlock your account"
        details: >
          Go to https://aka.ms/sspr in a browser. Enter your Aditi email,
          verify your identity via the registered method (email/phone/authenticator),
          and reset your password. This unlocks and resets in one step.
      - step_number: 3
        instruction: "Wait 30 minutes if SSPR is not available"
        details: >
          If you cannot access SSPR, the account auto-unlocks after 30 minutes
          of no login attempts. After 30 minutes, try signing in with your
          correct password.
      - step_number: 4
        instruction: "Update saved passwords everywhere"
        details: >
          After resetting, update the saved password in your browser, VPN client,
          Outlook mobile app, and any other apps that may be retrying with the
          old password — these hidden retries keep re-locking the account.
    escalation_trigger: >
      If SSPR fails, account is still locked after 30 minutes, or you believe
      your account may have been compromised, contact IT support immediately.
    resolution_rate: 0.85

  - id: "access-password-expired"
    title: "Password Expired / Force Password Change"
    category: "access/permissions"
    subcategory: "password-expired"
    tags: ["password expired", "change password", "reset password", "force change"]
    keywords:
      ["password expired", "must change password", "change your password",
       "password needs to be changed", "force change password", "password reset"]
    content: |
      Aditi's password policy requires a password change every 90 days.
      When the password expires, Windows prompts for a change on login,
      and Outlook/VPN may also stop working until you update.
    short_summary: |
      Password expired. Press Ctrl+Alt+Del on your laptop to change it,
      or use SSPR at aka.ms/sspr. Then update all apps with the new password.
    resolution_steps:
      - step_number: 1
        instruction: "Change your password using Ctrl+Alt+Del on your Windows laptop"
        details: >
          On your Aditi laptop, press Ctrl+Alt+Del and select 'Change a password'.
          Enter the old password and set a new one. Password must be 12+ characters,
          with uppercase, lowercase, number, and symbol.
      - step_number: 2
        instruction: "Alternatively, use SSPR at https://aka.ms/sspr"
        details: >
          If you cannot log in at all, go to https://aka.ms/sspr, verify your
          identity, and set a new password remotely.
      - step_number: 3
        instruction: "Update your password in all connected apps and devices"
        details: >
          After changing: update Outlook mobile, VPN client (GlobalProtect/Cisco),
          Teams mobile, and any browser saved passwords. Old passwords stored in
          apps will re-lock your account.
      - step_number: 4
        instruction: "Re-authenticate in Outlook and VPN"
        details: >
          Open Outlook — it may prompt for your new credentials. Open your VPN
          client and sign in again with the new password.
    escalation_trigger: >
      If you are unable to change the password via Ctrl+Alt+Del or SSPR,
      or if the password change fails with an error, contact IT support.
    resolution_rate: 0.88

  - id: "access-mfa-not-working"
    title: "MFA / Authenticator Not Working"
    category: "access/permissions"
    subcategory: "mfa-not-working"
    tags: ["mfa", "multi-factor", "authenticator", "microsoft authenticator", "2fa", "otp"]
    keywords:
      ["mfa not working", "authenticator not working", "no code", "authenticator app",
       "two factor", "2fa", "one time code", "push notification not arriving"]
    content: |
      Microsoft Authenticator MFA issues prevent login to all O365 services,
      VPN, and Aditi systems. Common causes: phone time is off, app needs
      refresh, or the MFA registration is stale.
    short_summary: |
      Check phone date/time is auto-set. Open Authenticator app and refresh
      accounts. If push not arriving, use the 6-digit code instead.
    resolution_steps:
      - step_number: 1
        instruction: "Ensure your phone's date and time are set to automatic"
        details: >
          Go to Settings > General (iOS) or Settings > Date & Time (Android)
          and enable 'Set Automatically'. An incorrect clock causes TOTP
          codes to be invalid.
      - step_number: 2
        instruction: "Open the Microsoft Authenticator app and pull down to refresh"
        details: >
          Open Authenticator, find your Aditi account, and pull down to force
          a refresh. This resolves most push notification delays.
      - step_number: 3
        instruction: "Use the 6-digit code instead of waiting for the push notification"
        details: >
          Tap your Aditi account in Authenticator to see the 6-digit TOTP code.
          Enter this manually on the sign-in page when prompted. This works
          even when push notifications fail.
      - step_number: 4
        instruction: "If you have lost your phone or Authenticator access, use a backup method"
        details: >
          On the Microsoft sign-in page, click 'Sign in another way' to use
          SMS, email, or a backup code if you configured one.
    escalation_trigger: >
      If you have lost access to your phone, have no backup method, or need
      to re-register MFA on a new device, contact IT support — they will
      verify your identity and reset your MFA registration.
    resolution_rate: 0.80
