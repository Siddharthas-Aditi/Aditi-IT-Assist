[project]
name = "aditi-it-assist-backend"
version = "0.1.0"
description = "Backend API for Aditi IT Assist"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "litellm>=1.40",
    "langgraph>=0.1",
    "langchain-core>=0.2",
    "pgvector>=0.3",
    "structlog>=24.1",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "prometheus-client>=0.20",
    # Document ingestion
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    # Pinned to a minor range: an unbounded ruff caused silent lint-gate drift
    # (new rules flagged pre-existing intentional patterns and the whole gate
    # went red unnoticed). Bump deliberately, not implicitly.
    "ruff>=0.15,<0.16",
    "mypy>=1.10",
    "factory-boy>=3.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
# Principled, documented exceptions to framework-idiomatic / deliberate patterns:
ignore = [
    # `class X(str, Enum)` is intentional throughout. Migrating to `StrEnum`
    # changes `str(member)`/f-string semantics (returns the value, not
    # `X.MEMBER`), which downstream formatting relies on. Do NOT auto-migrate.
    "UP042",
    # Domain exception names (SessionNotFound, ArticleNotFound, ...) are a
    # deliberate, consistent convention; the "Error" suffix would churn every
    # call site for no behavioural gain.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves `Mapped[...]` annotations at RUNTIME during mapper
# config, so type-only imports (uuid, datetime) must stay importable at
# runtime — moving them into a TYPE_CHECKING block breaks the ORM.
"app/models/**" = ["TC001", "TC002", "TC003"]
# Pydantic likewise evaluates field annotations at runtime to build models,
# so schema modules must keep annotation imports (uuid, datetime, UUID) at
# module scope — the TYPE_CHECKING move breaks `model_rebuild()`.
"app/schemas/**" = ["TC001", "TC002", "TC003"]
# FastAPI's dependency-injection idiom is a function call in an argument
# default (`= Depends(...)`, `= Query(...)`); that is correct, not a B008 bug.
"app/api/**" = ["B008"]
# Settings uses ALL-CAPS computed properties (DATABASE_URL, REDIS_URL) as public
# config surface referenced everywhere; renaming them is not desirable.
"app/core/config.py" = ["N802"]
# Test helpers use short/upper-case locals (matrix/vector fixtures, `l`) freely.
"tests/**" = ["N806", "E741"]
# `import web_search_service as W` is a deliberate short module alias used
# throughout this test file's assertions (W.httpx, W.settings, W.DomainTrust).
"tests/unit/test_web_search_providers.py" = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
