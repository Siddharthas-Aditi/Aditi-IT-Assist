server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (SPA + proxied API) ─────────────────────────
    # CSP notes: Vite bundles emit no inline scripts; styles need
    # 'unsafe-inline' for Tailwind's runtime-injected style tags in some
    # component libs. connect-src 'self' covers the same-origin /api proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS is intentionally commented until TLS terminates in front of nginx —
    # enabling it on plain HTTP bricks nothing but is misleading. Uncomment in
    # the TLS-terminating deployment (see docs/deployment/production-deployment.md).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Don't advertise the nginx version.
    server_tokens off;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Metrics are for the internal monitoring network only — never proxied
    # through the public vhost. Scrape the backend directly instead.
    location /api/v1/health/metrics {
        deny all;
        return 403;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets.
    # nginx gotcha: add_header in a location REPLACES inherited headers, so
    # the security set must be repeated here alongside Cache-Control.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
