# ==================================================
# Aditi IT Assist — Docker Compose (Development)
# ==================================================
# Usage:
#   make dev          → Full stack with hot-reload
#   make dev-infra    → Postgres + Redis only (run backend/frontend locally)
#   make docker-up    → Production-like build

services:
  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aditi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aditi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aditi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aditi_assist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aditi} -d ${POSTGRES_DB:-aditi_assist}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aditi-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Backend API (FastAPI + LangGraph)
  # ──────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST:-}
    container_name: aditi-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:cached
      - ./backend/tests:/app/tests:cached
      - backend_cache:/app/.venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Frontend (Vite dev server with HMR)
  # ──────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}
    container_name: aditi-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached
      - ./frontend/index.html:/app/index.html:cached
      - ./frontend/vite.config.ts:/app/vite.config.ts:cached
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:cached
      - ./frontend/postcss.config.js:/app/postcss.config.js:cached
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_cache:
