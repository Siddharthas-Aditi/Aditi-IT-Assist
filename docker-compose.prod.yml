# ==================================================
# Aditi IT Assist — Docker Compose (Production)
# ==================================================
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# This file builds production images and runs the full stack
# with proper health checks, resource limits, and non-root users.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aditi-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aditi_assist}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  redis:
    image: redis:7-alpine
    container_name: aditi-redis-prod
    # REDIS_PASSWORD has no default on purpose: compose interpolation fails
    # fast when it is unset, and the backend refuses to boot without it
    # (Settings.validate_production). Never run production Redis unauthenticated.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for production}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for production}
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always

  # One-shot migration runner — the backend only starts after this exits 0,
  # so app containers never serve traffic against an unmigrated schema.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: aditi-migrate-prod
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: aditi-backend-prod
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - DEBUG=false
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: aditi-frontend-prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    restart: always

volumes:
  postgres_data:
  redis_data:
